<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>CSS Transition Navigation</title>

        <link rel="stylesheet" href="style.css">

        <link rel="stylesheet" href="assets/lib/normalize.css">
    <title>case_03</title>
</head>
    <style>
        section {
            width: 800px;
            height: 500px;
            border: 4px solid black;
            overflow: hidden;
        }

        section>div {
            width: 200px;
            height: 100px;
            border-radius: 15px;

            animation-name: moving-animation;
            animation-duration: 3000ms;
            animation-direction: alternate-reverse;
            animation-iteration-count: infinite;
        }

    </style>










<body>

<section>
    <div></div>
</section>

</body>
</html>
