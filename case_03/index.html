<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>CSS Transition Navigation</title>

        <link rel="stylesheet" href="style.css">

        <link rel="stylesheet" href="assets/lib/normalize.css">
    <title>case_03</title>
</head>
    <style>
        section {
            width: 800px;
            height: 500px;
            border: 4px solid black;
            overflow: hidden;
        }

        section>div {
            width: 200px;
            height: 100px;
            border-radius: 15px;

            animation-name: moving-animation;
            animation-duration: 3000ms;
            animation-direction: alternate-reverse;
            animation-iteration-count: infinite;
        }


        @keyframes moving-animation {
            0% {
                margin-left: 0;
                margin-top: 0;
                transform: rotate(0deg);
                background-color: darkorange;
            }
            25% {
                margin-left: calc(800px - 200px); /* 800px - 200px = 600px */
                margin-top: 0;
                transform: rotate(180deg);
                background-color: #ff253a;
            }
            50% {
                margin-left: calc(800px - 200px); /* 800px - 200px = 600px */
                margin-top: calc(500px - 100px); /* 500px - 100px = 400px */
                transform: rotate(360deg);
                background-color: darkred;
            }
            75% {
                margin-left: 0;
                margin-top: calc(500px - 100px); /* 500px - 100px = 400px */
                transform: rotate(540deg);
                background-color: blue;
            }
            100% {
                margin-left: 0;
                margin-top: 0;
                transform: rotate(720deg);
                background-color: deeppink;
            }
        }

    </style>










<body>

<section>
    <div></div>
</section>

</body>
</html>
